name: Competitor Pricing Report

on:
  schedule:
    - cron: "0 7 * * 1" # every Monday 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write # to commit the weekly history snapshot back to the repo

concurrency:
  group: competitor-pricing
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/competitor-pricing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Write config.yaml from secret
        run: echo "$COMPETITOR_PRICING_CONFIG" > config.yaml
        env:
          COMPETITOR_PRICING_CONFIG: ${{ secrets.COMPETITOR_PRICING_CONFIG }}

      - name: Run report
        run: |
          python -m competitor_pricing.main \
            --config config.yaml \
            --output-json ../../dashboard/public/data/latest.json \
            --history-dir ../../dashboard/public/data/history
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          AIRBNB_DATA_API_KEY: ${{ secrets.AIRBNB_DATA_API_KEY }}

      - name: Commit history snapshot
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/data
          git diff --cached --quiet || git commit -m "Weekly competitor pricing data $(date -u +%F)"
          git push

      - name: Deploy dashboard to Vercel
        working-directory: dashboard
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_oQmdjIkbiCNFc7TzbEIoYjRe
          VERCEL_PROJECT_ID: prj_Pfgfp348VL31Gge6cj0SGAtyC1Ks
